<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VitalCare · Estación de monitoreo</title>
  <meta name="description" content="Estación de monitoreo de signos vitales VitalCare (Proyecto ITT466, PUCMM). Prototipo académico con datos de prueba; no es un dispositivo médico.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2A43'/%3E%3Cpath d='M4 17h6l3-7 5 13 3-6h7' fill='none' stroke='%232E9E6B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="estilo.css">
  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/mqtt.min.js"></script>
  <script src="vendor/html2canvas.min.js" defer></script>
</head>
<body>
  <div id="app">
    <div class="cargando">
      <b>VitalCare</b>
      <span id="cargando-texto">Abriendo la estación de monitoreo…</span>
    </div>
  </div>
  <noscript>VitalCare necesita JavaScript activado.</noscript>
  <script type="module">
    import { iniciar } from "./js/app.js";

    const raiz = document.getElementById("app");
    const fallo = (titulo, texto) => {
      raiz.innerHTML = "";
      const caja = document.createElement("div");
      caja.className = "cargando fallo";
      caja.innerHTML = "<b></b><span></span>";
      caja.querySelector("b").textContent = titulo;
      caja.querySelector("span").textContent = texto;
      raiz.append(caja);
    };

    async function arrancar() {
      try { await iniciar(raiz); }
      catch (e) {
        console.error(e);
        fallo("No se pudo abrir VitalCare", `${e.message || e}. Recargue la página; si sigue igual, use Google Chrome o Microsoft Edge actualizados.`);
      }
    }

    // Una sola pestaña a la vez: dos pestañas escribiendo la misma base se pisarían los datos.
    if (navigator.locks) {
      navigator.locks.request("vitalcare-estacion", { ifAvailable: true }, async (candado) => {
        if (!candado) {
          fallo("VitalCare ya está abierta en otra pestaña",
            "Cierre las otras pestañas de VitalCare de este navegador y recargue esta página. Así los datos no se mezclan.");
          return;
        }
        await arrancar();
        await new Promise(() => {}); // el candado se conserva mientras la pestaña esté abierta
      });
    } else {
      arrancar();
    }
  </script>
</body>
</html>
